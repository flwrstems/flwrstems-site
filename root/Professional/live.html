<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Stream</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .player-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .fallback {
      position: absolute;
      color: #fff;
      text-align: center;
      padding: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="fallback" class="fallback">
      Your browser does not support MPEG-TS playback with this player.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
  <script>
    const streamUrl = "https://stream.vrcdn.live/live/flwrstems.live.ts";
    const video = document.getElementById("video");
    const fallback = document.getElementById("fallback");

    if (window.mpegts && mpegts.isSupported && mpegts.isSupported()) {
      const player = mpegts.createPlayer({
        type: "mse",
        isLive: true,
        url: streamUrl
      });

      player.attachMediaElement(video);
      player.load();
      player.play();

      video.addEventListener("error", () => {
        fallback.style.display = "block";
      });
    } else {
      fallback.style.display = "block";
    }
  </script>
</body>
</html>
